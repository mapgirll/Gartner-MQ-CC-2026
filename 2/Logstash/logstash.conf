# Pipeline: same file inputs, filter by log level, send to different outputs.
# Structure: https://www.elastic.co/docs/reference/logstash/configuration-file-structure
# Elasticsearch Serverless: https://www.elastic.co/docs/reference/logstash/connecting-to-serverless
# Elasticsearch Serverless: endpoint and API key below.

input {
  file {
    path => [
      "/var/log/app.log",
      "/var/log/application.log",
      "/var/log/service.log"
    ]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    codec => "plain"
    type => "app"
  }
}

filter {
  # Parse JSON line into event fields (if message is JSON)
  json {
    source => "message"
    skip_on_invalid_json => true
  }

  # Derive level from message (always overwrite). Match ERROR, WARN, DEBUG via character classes (no /i flag).
  if [message] =~ /(log\.level\s*=\s*)?[Ee][Rr][Rr][Oo][Rr]\b/ {
    mutate { replace => { "level" => "error" } }
  } else if [message] =~ /(log\.level\s*=\s*)?[Ww][Aa][Rr][Nn]([Ii][Nn][Gg])?\b/ {
    mutate { replace => { "level" => "warn" } }
  } else if [message] =~ /(log\.level\s*=\s*)?[Dd][Ee][Bb][Uu][Gg]\b/ {
    mutate { replace => { "level" => "debug" } }
  } else if ![level] {
    mutate { add_field => { "level" => "info" } }
  }
  mutate {
    lowercase => [ "level" ]
  }

  # ECS-style log.level (copy from level so it appears as log.level in Elasticsearch)
  mutate {
    add_field => { "[log][level]" => "%{level}" }
  }
}

output {
  # Stdout and file for all events (optional)
  stdout { codec => rubydebug }
  file {
    path => "/usr/share/logstash/data/application-%{+YYYY.MM.dd}.log"
    codec => json_lines
  }

  # Elasticsearch: route by level (if/else only for observability).
  # ERROR -> application-error; all other levels -> application-log.
  if [level] == "error" {
    elasticsearch {
      hosts => "***"
      api_key => "***"
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "application-error"
      data_stream_namespace => "default"
      ecs_compatibility => "v8"
    }
  } else {
    elasticsearch {
      hosts => "***"
      api_key => "**"
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "application-log"
      data_stream_namespace => "default"
      ecs_compatibility => "v8"
    }
  }

  # Also write all events to index "logs" (create)
  elasticsearch {
    hosts => ["***"]
    api_key => "***"
    index => "logs"
    action => "create"
  }

  # Same, to index "logs-frozen" (create)
  elasticsearch {
    hosts => ["***"]
    api_key => "***"
    index => "logs-frozen"
    action => "create"
  }

  # Same, to index "logs.ecs" (create)
  elasticsearch {
    hosts => ["***"]
    api_key => "***"
    index => "logs.ecs"
    action => "create"
  }

  # S3: 100% of events (outside if/else). Single config, no duplication.
  s3 {
    bucket => "logstash-application-log-bucket"
    region => "ca-central-1"
    access_key_id => "***"
    secret_access_key => "***"
    prefix => "application-log/%{+YYYY}/%{+MM}/%{+dd}"
    size_file => 5242880
    time_file => 1
    rotation_strategy => "size_and_time"
    codec => "json_lines"
    canned_acl => "private"
  }
}

