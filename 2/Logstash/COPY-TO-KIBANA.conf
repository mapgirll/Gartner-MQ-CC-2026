input {
  file {
    path => [
      "/var/log/app.log",
      "/var/log/application.log",
      "/var/log/service.log"
    ]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    codec => "plain"
    type => "app"
  }
}

filter {
  json {
    source => "message"
    skip_on_invalid_json => true
  }
  if [message] =~ /(log\.level\s*=\s*)?[Ee][Rr][Rr][Oo][Rr]\b/ {
    mutate { replace => { "level" => "error" } }
  } else if [message] =~ /(log\.level\s*=\s*)?[Ww][Aa][Rr][Nn]([Ii][Nn][Gg])?\b/ {
    mutate { replace => { "level" => "warn" } }
  } else if [message] =~ /(log\.level\s*=\s*)?[Dd][Ee][Bb][Uu][Gg]\b/ {
    mutate { replace => { "level" => "debug" } }
  } else if ![level] {
    mutate { add_field => { "level" => "info" } }
  }
  mutate {
    lowercase => [ "level" ]
  }
}

output {
  stdout { codec => rubydebug }
  file {
    path => "/usr/share/logstash/data/application-%{+YYYY.MM.dd}.log"
    codec => json_lines
  }
  if [level] == "error" {
    elasticsearch {
      hosts => ["***"]
      api_key => "***"
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "application-error"
      data_stream_namespace => "default"
      ecs_compatibility => "v8"
    }
  } else {
    elasticsearch {
      hosts => ["***"]
      api_key => "***"
      data_stream => true
      data_stream_type => "logs"
      data_stream_dataset => "application-log"
      data_stream_namespace => "default"
      ecs_compatibility => "v8"
    }
  }
  s3 {
    bucket => "logstash-application-log-bucket"
    region => "ca-central-1"
    access_key_id => "***"
    secret_access_key => "***"
    prefix => "application-log/%{+YYYY}/%{+MM}/%{+dd}"
    size_file => 5242880
    time_file => 1
    rotation_strategy => "size_and_time"
    codec => "json_lines"
    canned_acl => "private"
  }
}
