# EDOT (Elastic Distribution of OpenTelemetry) Collector manifest
# with awss3exporter, filterprocessor, and redactionprocessor.
#
# filterprocessor is already in the upstream elastic-components manifest;
# this file adds exporter/awss3exporter and processor/redactionprocessor.
#
# Use: Replace distributions/elastic-components/manifest.yaml in a clone of
#   https://github.com/elastic/opentelemetry-collector-components
# with this file (or add the lines below), then build.
#
# Based on:
#   https://github.com/elastic/opentelemetry-collector-components/tree/main/distributions/elastic-components

dist:
  module: github.com/elastic/opentelemetry-collector-components
  name: elastic-collector-components
  description: EDOT with awss3, filter, and redaction (Elastic components + contrib awss3exporter, redactionprocessor)
  version: 0.0.1
  output_path: ./_build

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/basicauthextension v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.147.0
  - gomod: go.opentelemetry.io/collector/extension/memorylimiterextension v0.147.0
  - gomod: github.com/elastic/opentelemetry-collector-components/extension/apmconfigextension v0.20.0
  - gomod: github.com/elastic/opentelemetry-collector-components/extension/apikeyauthextension v0.20.0
  - gomod: github.com/elastic/opentelemetry-collector-components/extension/configintegrationextension v0.0.0
  - gomod: github.com/elastic/opentelemetry-collector-components/extension/fileintegrationextension v0.0.0
  - gomod: github.com/elastic/opentelemetry-collector-components/extension/clientaddrmiddlewareextension v0.0.0

connectors:
  - gomod: github.com/elastic/opentelemetry-collector-components/connector/elasticapmconnector v0.20.0
  - gomod: github.com/elastic/opentelemetry-collector-components/connector/dynamicroutingconnector v0.20.0

converters:

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/nopreceiver v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/jaegerreceiver v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/zipkinreceiver v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/httpcheckreceiver v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8sclusterreceiver v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8sobjectsreceiver v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kubeletstatsreceiver v0.147.0
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.147.0
  - gomod: github.com/elastic/opentelemetry-collector-components/receiver/integrationreceiver v0.0.0
  - gomod: github.com/elastic/opentelemetry-collector-components/receiver/loadgenreceiver v0.20.0
  - gomod: github.com/elastic/opentelemetry-collector-components/receiver/elasticapmintakereceiver v0.20.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/cumulativetodeltaprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/redactionprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.147.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.147.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/elasticinframetricsprocessor v0.20.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/elasticapmprocessor v0.20.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/integrationprocessor v0.0.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/lsmintervalprocessor v0.20.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/ratelimitprocessor v0.22.0
  - gomod: github.com/elastic/opentelemetry-collector-components/processor/elastictraceprocessor v0.20.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/elasticsearchexporter v0.147.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.147.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.147.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.147.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.147.0
  # Added: AWS S3 exporter for backup/archival (e.g. OTLP JSON to S3)
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/awss3exporter v0.147.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.53.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.53.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpprovider v1.53.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.53.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.53.0

replaces:
  - github.com/elastic/opentelemetry-collector-components/pkg/integrations => ../pkg/integrations
  - github.com/elastic/opentelemetry-collector-components/processor/elasticinframetricsprocessor => ../processor/elasticinframetricsprocessor
  - github.com/elastic/opentelemetry-collector-components/processor/elasticapmprocessor => ../processor/elasticapmprocessor
  - github.com/elastic/opentelemetry-collector-components/processor/integrationprocessor => ../processor/integrationprocessor
  - github.com/elastic/opentelemetry-collector-components/processor/lsmintervalprocessor => ../processor/lsmintervalprocessor
  - github.com/elastic/opentelemetry-collector-components/receiver/loadgenreceiver => ../receiver/loadgenreceiver
  - github.com/elastic/opentelemetry-collector-components/processor/ratelimitprocessor => ../processor/ratelimitprocessor
  - github.com/elastic/opentelemetry-collector-components/extension/apmconfigextension => ../extension/apmconfigextension
  - github.com/elastic/opentelemetry-collector-components/extension/apikeyauthextension => ../extension/apikeyauthextension
  - github.com/elastic/opentelemetry-collector-components/extension/configintegrationextension => ../extension/configintegrationextension
  - github.com/elastic/opentelemetry-collector-components/extension/fileintegrationextension => ../extension/fileintegrationextension
  - github.com/elastic/opentelemetry-collector-components/extension/clientaddrmiddlewareextension => ../extension/clientaddrmiddlewareextension
  - github.com/elastic/opentelemetry-collector-components/connector/elasticapmconnector => ../connector/elasticapmconnector
  - github.com/elastic/opentelemetry-collector-components/connector/dynamicroutingconnector => ../connector/dynamicroutingconnector
  - github.com/elastic/opentelemetry-collector-components/receiver/elasticapmintakereceiver => ../receiver/elasticapmintakereceiver
  - github.com/elastic/opentelemetry-collector-components/receiver/integrationreceiver => ../receiver/integrationreceiver
  - github.com/elastic/opentelemetry-collector-components/processor/elastictraceprocessor => ../processor/elastictraceprocessor
  - github.com/elastic/opentelemetry-collector-components/internal/elasticattr => ../internal/elasticattr
